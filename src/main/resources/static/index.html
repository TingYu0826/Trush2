<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>傢俱回收通 智慧自動派車系統</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container py-4">
    <h2 class="mb-4">傢俱回收通 智慧自動派車系統</h2>
    <!-- 輸入區 -->
    <div class="card mb-3">
        <div class="card-header">物品輸入</div>
        <div class="card-body row g-2 align-items-end">
            <div class="col-md-2">
                <label class="form-label">長 (m)</label>
                <input type="number" class="form-control" id="itemLength" min="0" step="0.01">
            </div>
            <div class="col-md-2">
                <label class="form-label">寬 (m)</label>
                <input type="number" class="form-control" id="itemWidth" min="0" step="0.01">
            </div>
            <div class="col-md-2">
                <label class="form-label">高 (m)</label>
                <input type="number" class="form-control" id="itemHeight" min="0" step="0.01">
            </div>
            <div class="col-md-3">
                <label class="form-label">類別</label>
                <input type="text" class="form-control" id="itemCategory" placeholder="如：沙發、冰箱">
            </div>
            <div class="col-md-2">
                <label class="form-label">破損/可壓縮</label>
                <input type="checkbox" class="form-check-input" id="itemDamaged"> 是
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" onclick="addItem()">加入物品</button>
            </div>
        </div>
    </div>
    <!-- 物品清單 -->
    <div class="mb-3">
        <table class="table table-bordered align-middle" id="itemsTable">
            <thead class="table-light">
            <tr>
                <th>#</th>
                <th>長(m)</th>
                <th>寬(m)</th>
                <th>高(m)</th>
                <th>類別</th>
                <th>破損</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <!-- 計算區 -->
    <div class="mb-3 text-end">
        <button class="btn btn-success px-4" onclick="startDispatch()">開始派車</button>
    </div>
    <!-- 結果區 -->
    <div id="resultArea"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
